---
# Four exclusions, all because a tool is being applied outside the context it can
# reason about. None hides a finding about shipped behaviour.
#
# drizzle/**
#   Codacy runs a SQL Server (T-SQL) linter over .sql files and reports things
#   that have no PostgreSQL meaning: SET ANSI_NULLS, SET QUOTED_IDENTIFIER, READ
#   UNCOMMITTED isolation, table data compression. "Object name not schema
#   qualified" is simply how drizzle-kit generates DDL for the public schema.
#   These files are generated output, kept byte-for-byte as drizzle-kit produced
#   it, and two CI guards (`pnpm db:check`) exist to keep model, SQL and snapshot
#   in agreement. Hand-editing migrations to satisfy a linter for a different
#   database engine would undermine exactly that.
#
# firmware/host_test/**
#   Host-native test fixtures. flawfinder flags strlen, memset and friends
#   unconditionally, regardless of whether the argument is a string literal three
#   lines above. Rewriting assertions to avoid those calls would make the tests
#   less readable and prove nothing about the firmware.
#
# scripts/check-*.mjs
#   The repository's own CI gates. Codacy reports "The application dynamically
#   constructs file or path information" (CWE-22) wherever one of them calls
#   readFileSync, readdirSync or existsSync on a path it assembled -- which is what
#   a gate that walks src/ and i18n/messages/ does on every line. The rule is
#   written for request handlers, where the path can carry an attacker's input.
#   These files take no input at all: they are run by pnpm and by .githooks, they
#   read fixed directories relative to the repository root, and the only way to
#   influence the path is to already have write access to the checkout -- at which
#   point editing the gate itself is the shorter route.
#
#   The pattern is deliberately NOT scripts/**. `scripts/migrate.mjs` is the
#   container's CMD (Dockerfile line 82), so it is production code and stays under
#   analysis, as do mdns-announce.mjs, classify-release-commit.mjs,
#   firmware-beta-version.mjs and setup-git-hooks.mjs. Only the check-* gates are
#   excluded, and none of them is copied into the image (the Dockerfile takes
#   setup-git-hooks.mjs alone).
#
#   What this costs, stated plainly: a genuine defect in a gate script will no
#   longer be reported by Codacy. The gates are covered instead by tsc, eslint and
#   prettier over the whole tree, and by the fact that a broken gate fails CI
#   loudly rather than silently -- each one is only useful while it still runs.
#
# deploy/updater/*.test.mjs
#   The updater's own test harness, and the same CWE-22 rule as the gates above:
#   "Found readFileSync/writeFileSync/existsSync/chmodSync with non literal
#   argument". Every one of those paths is built under a directory this file just
#   created with mkdtempSync, and the harness takes no input at all -- it writes a
#   fake `docker` onto PATH and reads back the calls that fake recorded. That fake
#   is the point of the test: the control plane spawns docker for real, so proving
#   that a removed guard is noticed means letting it spawn something. Injecting a
#   stub runner instead would test the injection, not the spawn.
#
#   The pattern is *.test.mjs, not deploy/updater/**. The Dockerfile copies
#   update.sh and control.mjs (lines 23 and 24), and both stay under analysis --
#   the object-injection finding in control.mjs from this same run was fixed in
#   the code, not excluded here.
#
#   What this costs, stated plainly: a genuine defect in the harness will no
#   longer be reported by Codacy. It is covered instead by prettier and
#   `node --check` over the whole tree, and by the fact that the harness runs in
#   CI on every change to the updater -- a broken one fails there loudly.

exclude_paths:
  - "drizzle/**"
  - "firmware/host_test/**"
  - "scripts/check-*.mjs"
  - "deploy/updater/*.test.mjs"
