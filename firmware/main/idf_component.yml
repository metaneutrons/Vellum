dependencies:
  espressif/cjson:
    version: ">=1.7.15"
  espressif/mdns:
    version: ">=1.0.0"
  espressif/esp_wifi_remote:
    version: "1.*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "2.*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_jpeg:
    version: "*"
  espressif/esp_io_expander:
    version: "^1"
    rules:
      - if: "target == esp32p4"
  # PCA9535 expander is vendored in components-lcd/ — the registry version
  # (wngfra 1.0.1) omits esp_driver_i2c from its requires and fails on IDF 6.0.
  waveshare/esp_lcd_jd9365_8:
    version: "^2.0.0"
    rules:
      - if: "target == esp32p4"

