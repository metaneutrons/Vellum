name: vellum

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: vellum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vellum}
      POSTGRES_USER: ${POSTGRES_USER:-vellum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores its versioned cluster below this parent directory.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vellum} -d $${POSTGRES_DB:-vellum}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  server:
    image: ${VELLUM_IMAGE:?set VELLUM_IMAGE in .env}
    container_name: vellum
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      UPDATER_URL: http://updater:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  updater:
    image: ${UPDATER_IMAGE:?set UPDATER_IMAGE in .env}
    container_name: vellum-updater
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      COMPOSE_FILE: /stack/docker-compose.yml
      COMPOSE_PROJECT: vellum
      COMPOSE_SERVICE: server
      TARGET_CONTAINER: vellum
      DATABASE_CONTAINER: vellum-postgres
      IMAGE_REPOSITORY: ghcr.io/metaneutrons/vellum
      POLL_INTERVAL_SECONDS: "900"
      UPDATE_TIMEOUT_SECONDS: "900"
      AUTO_APPLY: ${AUTO_APPLY:-true}
      MAINTENANCE_TIME: ${MAINTENANCE_TIME:-02:00}
      TZ: ${TZ:-UTC}
      UPDATER_CONFIG_FILE: /state/config.json
      HOME: /tmp
      VELLUM_ENV_FILE: /stack/.env
      READINESS_URL: http://server:3000/api/v1/health
      READINESS_TIMEOUT_SECONDS: "120"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
    env_file:
      - ./.env
    volumes:
      # Docker socket access is intentionally isolated to the updater. It is
      # root-equivalent; never expose this container or its API to the network.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/stack/docker-compose.yml:ro
      - ./data/backups:/backups
      - ./data/updater:/state
      # The updater persists a successfully deployed exact server tag here so a
      # later operator-run `docker compose up` cannot silently roll it back.
      - ./.env:/stack/.env
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    # DAC_OVERRIDE is required, not optional hardening slack. The documented
    # `.env` deliberately stays 0600 and is owned by the host account that
    # deployed the stack, while this container runs as root — so after
    # `cap_drop: ALL` it may neither read the mounted env file nor persist the
    # newly deployed VELLUM_IMAGE pin, and update.sh fails closed at its
    # "environment file is not readable/writable" preflight. Verified: with
    # cap_drop ALL alone, both read and write are denied on a 0600 file owned by
    # another uid; adding DAC_OVERRIDE restores exactly that access and leaves
    # the file's mode and ownership untouched.
    # Do NOT "fix" this by relaxing .env to 0644 or by dropping the rw mount.
    # This is the minimal capability for the job, and the container only ever
    # sees its own narrow stack mounts.
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
