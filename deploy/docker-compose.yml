name: vellum

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: vellum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vellum}
      POSTGRES_USER: ${POSTGRES_USER:-vellum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores its versioned cluster below this parent directory.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vellum} -d $${POSTGRES_DB:-vellum}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  server:
    image: ${VELLUM_IMAGE:?set VELLUM_IMAGE in .env}
    container_name: vellum
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-./.env}
    environment:
      UPDATER_URL: http://updater:8080
      # Derived from POSTGRES_* so the database password lives in exactly one
      # place. It used to be typed into both POSTGRES_PASSWORD and DATABASE_URL,
      # and a mismatch produced a stack that started and then failed to
      # authenticate against its own database — a runtime failure far from the
      # typo. Setting DATABASE_URL in .env still wins, for a database outside
      # this stack. If you set POSTGRES_PASSWORD by hand, keep it URL-safe
      # (no @ : / % #) or set DATABASE_URL explicitly.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-vellum}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vellum}}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  updater:
    image: ${UPDATER_IMAGE:?set UPDATER_IMAGE in .env}
    container_name: vellum-updater
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      COMPOSE_FILE: /stack/docker-compose.yml
      COMPOSE_PROJECT: vellum
      # Compose runs again from inside the updater, but its Docker client talks
      # to the HOST daemon. Preserve the host-side project directory captured by
      # the initial `docker compose up`; otherwise relative bind sources resolve
      # to `/stack` on the host and become empty directories on self-update.
      HOST_STACK_DIR: ${HOST_STACK_DIR:-${PWD}}
      # Compose reads service env_file entries in the updater container, while
      # bind sources are resolved by the host daemon. Keep those paths distinct.
      COMPOSE_ENV_FILE: /stack/.env
      COMPOSE_SERVICE: server
      TARGET_CONTAINER: vellum
      DATABASE_CONTAINER: vellum-postgres
      IMAGE_REPOSITORY: ghcr.io/metaneutrons/vellum
      POLL_INTERVAL_SECONDS: "900"
      UPDATE_TIMEOUT_SECONDS: "900"
      AUTO_APPLY: ${AUTO_APPLY:-true}
      # Let the updater replace ITSELF after a healthy server update, via a
      # detached one-shot helper (it cannot recreate its own container directly).
      # The helper verifies health and rolls back, so new installations enable it.
      AUTO_UPDATE_UPDATER: ${AUTO_UPDATE_UPDATER:-true}
      MAINTENANCE_TIME: ${MAINTENANCE_TIME:-02:00}
      TZ: ${TZ:-UTC}
      UPDATER_CONFIG_FILE: /state/config.json
      HOME: /tmp
      VELLUM_ENV_FILE: /stack/.env
      READINESS_URL: http://server:3000/api/v1/health
      READINESS_TIMEOUT_SECONDS: "120"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
    env_file:
      - ${COMPOSE_ENV_FILE:-./.env}
    volumes:
      # Docker socket access is intentionally isolated to the updater. It is
      # root-equivalent; never expose this container or its API to the network.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/stack/docker-compose.yml:ro
      - ./data/backups:/backups
      - ./data/updater:/state
      # The updater persists a successfully deployed exact server tag here so a
      # later operator-run `docker compose up` cannot silently roll it back.
      - ./.env:/stack/.env
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    # DAC_OVERRIDE is required, not optional hardening slack. The documented
    # `.env` deliberately stays 0600 and is owned by the host account that
    # deployed the stack, while this container runs as root — so after
    # `cap_drop: ALL` it may neither read the mounted env file nor persist the
    # newly deployed VELLUM_IMAGE pin, and update.sh fails closed at its
    # "environment file is not readable/writable" preflight. Verified: with
    # cap_drop ALL alone, both read and write are denied on a 0600 file owned by
    # another uid; adding DAC_OVERRIDE restores exactly that access and leaves
    # the file's mode and ownership untouched.
    # Do NOT "fix" this by relaxing .env to 0644 or by dropping the rw mount.
    # This is the minimal capability for the job, and the container only ever
    # sees its own narrow stack mounts.
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
