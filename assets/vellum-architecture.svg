<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Vellum system architecture</title>
  <desc id="desc">Calendar and booking providers feed the Vellum server, which manages content, policy, devices, and signed updates for E-Paper and full-color LCD displays. PostgreSQL stores state and the optional updater safely installs server releases.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef5f6"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#363434"/>
      <stop offset="1" stop-color="#5a5559"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#363434" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e9177b"/>
    </marker>
    <style>
      .title{font:700 30px Inter,ui-sans-serif,system-ui,sans-serif;fill:#363434}.eyebrow{font:700 13px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.6px;fill:#e9177b}.card-title{font:700 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#363434}.body{font:500 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#526176}.small{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#69778a}.inverse{fill:#fff}.inverse-muted{fill:#dbe9ef}.card{fill:#fff;stroke:#dce4ea;stroke-width:1.5}.line{fill:none;stroke:#e9177b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#canvas)"/>
  <text x="60" y="65" class="eyebrow">SYSTEM ARCHITECTURE</text>
  <text x="60" y="105" class="title">One control plane. Every display.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="155" width="280" height="180" rx="20" class="card"/>
    <circle cx="102" cy="198" r="21" fill="#fce9f2"/>
    <path d="M91 198h22M102 187v22M94 190l16 16M110 190l-16 16" stroke="#e9177b" stroke-width="2" stroke-linecap="round"/>
    <text x="135" y="194" class="small">DATA PROVIDERS</text>
    <text x="88" y="246" class="card-title">Bookings &amp; calendars</text>
    <text x="88" y="278" class="body">Microsoft 365 · Google</text>
    <text x="88" y="305" class="body">anny · iCalendar</text>

    <rect x="400" y="145" width="400" height="255" rx="24" fill="url(#server)"/>
    <rect x="434" y="179" width="42" height="42" rx="12" fill="#fff" fill-opacity=".12"/>
    <path d="M445 190h8l4 9 4-9h8l-12 24z" fill="#e9177b"/>
    <text x="493" y="196" class="small inverse-muted">VELLUM SERVER</text>
    <text x="434" y="259" class="card-title inverse">Render, govern, operate</text>
    <rect x="434" y="286" width="152" height="38" rx="10" fill="#fff" fill-opacity=".1"/>
    <text x="453" y="310" class="body inverse">Admin &amp; access</text>
    <rect x="598" y="286" width="168" height="38" rx="10" fill="#fff" fill-opacity=".1"/>
    <text x="618" y="310" class="body inverse">Content &amp; themes</text>
    <rect x="434" y="336" width="152" height="38" rx="10" fill="#fff" fill-opacity=".1"/>
    <text x="453" y="360" class="body inverse">Fleet policy</text>
    <rect x="598" y="336" width="168" height="38" rx="10" fill="#fff" fill-opacity=".1"/>
    <text x="618" y="360" class="body inverse">Device API &amp; OTA</text>

    <rect x="860" y="155" width="280" height="180" rx="20" class="card"/>
    <circle cx="902" cy="198" r="21" fill="#fce9f2"/>
    <rect x="892" y="187" width="20" height="23" rx="3" fill="none" stroke="#e9177b" stroke-width="2"/>
    <path d="M897 205h10" stroke="#e9177b" stroke-width="2" stroke-linecap="round"/>
    <text x="935" y="194" class="small">MANAGED FLEET</text>
    <text x="888" y="246" class="card-title">Purpose-built displays</text>
    <text x="888" y="278" class="body">E1001 · E1002 · E1003</text>
    <text x="888" y="305" class="body">D1001 full-color LCD</text>

    <rect x="135" y="480" width="270" height="125" rx="20" class="card"/>
    <circle cx="178" cy="522" r="20" fill="#fce9f2"/>
    <path d="M166 518c0-7 24-7 24 0v14c0 7-24 7-24 0zM166 518c0 7 24 7 24 0M166 525c0 7 24 7 24 0" fill="none" stroke="#e9177b" stroke-width="2"/>
    <text x="211" y="518" class="small">STATE</text>
    <text x="163" y="570" class="card-title">PostgreSQL</text>

    <rect x="465" y="480" width="270" height="125" rx="20" class="card"/>
    <circle cx="508" cy="522" r="20" fill="#fce9f2"/>
    <path d="M508 511v18M501 522l7 7 7-7" fill="none" stroke="#e9177b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="541" y="518" class="small">OPERATIONS</text>
    <text x="493" y="560" class="card-title">Safe server updates</text>
    <text x="493" y="584" class="body">Verify · back up · roll back</text>

    <rect x="795" y="480" width="270" height="125" rx="20" class="card"/>
    <circle cx="838" cy="522" r="20" fill="#fce9f2"/>
    <path d="M828 525h20M832 519l-4 6 4 6M844 519l4 6-4 6" fill="none" stroke="#e9177b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="871" y="518" class="small">DEVICE CHANNEL</text>
    <text x="823" y="560" class="card-title">HTTPS + signed OTA</text>
    <text x="823" y="584" class="body">Config · images · telemetry</text>
  </g>

  <path d="M340 245H388" class="line"/>
  <path d="M800 245H848" class="line"/>
  <path d="M600 400V462" class="line"/>
  <path d="M465 542H423V418H535V412" class="line"/>
  <path d="M795 542H765V418H665V412" class="line"/>
</svg>
