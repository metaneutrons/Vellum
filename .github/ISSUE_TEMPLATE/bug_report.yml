name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security findings do not belong here. Use private vulnerability
        reporting instead, see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Server / admin interface
        - Content rendering (what the panel shows)
        - Device firmware (E1001 / E1002 / E1003)
        - Device firmware (D1001)
        - Provisioning / enrolment
        - OTA update
        - Deployment / container
        - Something else
    validations:
      required: true

  - type: input
    id: panel
    attributes:
      label: Panel model
      description: Only for display or firmware problems. USB, console and power differ per model, so this decides where to look.
      placeholder: E1002

  - type: input
    id: versions
    attributes:
      label: Server and firmware version
      placeholder: server 1.23.0, firmware 1.12.0

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Device log or server output. Remove tokens and PSKs before pasting.
      render: text
