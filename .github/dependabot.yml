# Dependabot version updates.
# Routine minor/patch bumps are GROUPED into one PR per ecosystem (JavaScript split
# into production vs development). MAJOR updates are intentionally left UNgrouped
# so each lands as its own review PR and is never auto-merged.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # ── pnpm lockfile — Next.js app (Dependabot ecosystem remains "npm") ──
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      pnpm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      pnpm-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint declares `typescript: >=4.8.4 <6.1.0` as a peer bound,
      # and lint runs with --max-warnings 0. A bump to 6.1 therefore produces a
      # PR that installs but fails type-aware linting with "does not support TS
      # 6.1". Lift this only once typescript-eslint widens the range; check with
      # `npm view @typescript-eslint/parser peerDependencies.typescript`.
      - dependency-name: typescript
        versions: [">=6.1"]

  # ── GitHub Actions — all .github/workflows/* ──────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  # ── Docker — Dockerfile base image (node:26-alpine) ───────────────
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        update-types: ["minor", "patch"]

  # ── Production Compose images (PostgreSQL digest, etc.) ───────────
  # Keep mutable upstream tags reviewable and deployments reproducible. Major
  # PostgreSQL upgrades remain separate PRs because they require a data upgrade.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose:
        update-types: ["minor", "patch"]
