# Dependabot version updates.
# Routine minor/patch bumps are GROUPED into one PR per ecosystem (npm split
# into production vs development). MAJOR updates are intentionally left UNgrouped
# so each lands as its own review PR and is never auto-merged.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # ── npm — Next.js app (repo root, package-lock.json) ───────────────
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      npm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # ── GitHub Actions — all .github/workflows/* ──────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  # ── Docker — Dockerfile base image (node:22-alpine) ───────────────
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        update-types: ["minor", "patch"]
