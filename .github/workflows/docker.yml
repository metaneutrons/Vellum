name: Docker Release
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths-ignore: ["firmware/**", "*.md"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vellum

jobs:
  routing:
    runs-on: ubuntu-latest
    outputs:
      release_component: ${{ steps.classify.outputs.release_component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Classify Release Please commit
        id: classify
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          COMPONENT=$(node scripts/classify-release-commit.mjs "$HEAD_COMMIT_MESSAGE")
          echo "release_component=${COMPONENT}" >> "$GITHUB_OUTPUT"

  # Build each arch on its NATIVE runner and push by digest (no tag yet), with an
  # SBOM + max-mode SLSA provenance attestation and a per-arch GHA build cache.
  build:
    needs: routing
    # Server-scoped only: a firmware release (`firmware-v*`) ships no Docker image
    # and must not move the `latest` tag or push a `firmware-v*`-named image.
    # A Release Please merge changes server release metadata, then emits a release
    # event. Skip that push build: the release event builds the same image once,
    # with the final version and `latest` tags.
    if: >-
      (github.event_name != 'release' ||
        !startsWith(github.event.release.tag_name, 'firmware')) &&
      (github.event_name != 'push' ||
        needs.routing.outputs.release_component == 'none')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push-by-digest + attestations; cosign/OIDC lives in the merge job
    steps:
      - name: Prepare platform label
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Release Please uses terse component-derived titles. Give server releases a
  # consistent human-facing name and reserve GitHub's "Latest" badge for them.
  release-presentation:
    if: >-
      github.event_name == 'release' &&
      !startsWith(github.event.release.tag_name, 'firmware')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Normalize server release presentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/${{ github.event.release.id }}" \
            -f "name=Vellum Server ${{ github.event.release.tag_name }}" \
            -F "make_latest=true"

  # Combine the per-arch digests into ONE multi-arch manifest, tag it, and sign it
  # keyless with cosign (Sigstore/Fulcio + Rekor transparency log).
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless OIDC
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest + push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t TAGS < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+=("-t" "$tag")
          done
          SOURCES=()
          for digest in ./*; do
            SOURCES+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest#./}")
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

      - name: Capture pushed manifest digest
        id: digest
        run: |
          d=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless — Sigstore/Fulcio + Rekor)
        # --recursive also signs each per-arch child manifest, so verification by a
        # platform-specific digest (not just by tag / index digest) succeeds too.
        run: cosign sign --yes --recursive "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}"
