name: Firmware PR Build

# Compile-only smoke test for firmware changes on PRs. The full signed matrix in
# firmware.yml runs ONLY on a `firmware-v*` release, so a -Werror break (e.g. the
# always-false `-Werror=type-limits` that failed the v1.2.0 firmware release)
# would otherwise surface only at release time. We build ONE model per chip /
# display backend — e1001 (ESP32-S3 / e-paper) and d1001 (ESP32-P4 / MIPI LCD) —
# because a P4-only break (LCD driver, esp-hosted Wi-Fi, `esp32p4` #if branches)
# compiles clean on S3 and would otherwise slip to release. Still far cheaper
# than the full 4-model signed release build.

on:
  pull_request:
    paths: ['firmware/**']

permissions:
  contents: read

# One in-flight build per PR branch; newer pushes cancel older runs.
concurrency:
  group: firmware-pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: e1001
            target: esp32s3
            base: sdkconfig.defaults.s3
            panel: CONFIG_VELLUM_PANEL_GDEY075T7=y
          - model: e1003
            target: esp32s3
            base: sdkconfig.defaults.s3
            overlay: sdkconfig.defaults.e1003
            panel: CONFIG_VELLUM_PANEL_E1003=y
          - model: d1001
            target: esp32p4
            base: sdkconfig.defaults.p4
            panel: CONFIG_VELLUM_PANEL_D1001=y
    container:
      image: espressif/idf:v6.0@sha256:c41bed8b8b28815526b70eac307452fb432c7904a9157fbaaa04784ac4840ad7
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure + compile (${{ matrix.model }} / ${{ matrix.target }}, compile-only)
        run: |
          . $IDF_PATH/export.sh
          # Mirror firmware.yml's config injection; the version is a placeholder
          # (this build is never released, only compiled).
          DEFAULTS="${{ matrix.base }}"
          OVERLAY="${{ matrix.overlay }}"
          if [ -n "$OVERLAY" ]; then DEFAULTS="$DEFAULTS;$OVERLAY"; fi
          printf 'CONFIG_VELLUM_FIRMWARE_VERSION="0.0.0-pr"\n%s\n' \
            '${{ matrix.panel }}' > sdkconfig.ci
          echo "0.0.0-pr" > version.txt
          idf.py -DVELLUM_MODEL=${{ matrix.model }} \
            -DSDKCONFIG_DEFAULTS="$DEFAULTS;sdkconfig.ci" \
            set-target ${{ matrix.target }}
          idf.py -DVELLUM_MODEL=${{ matrix.model }} build
