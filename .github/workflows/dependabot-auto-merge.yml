name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Guard on the PR AUTHOR — github.event.pull_request.user.login — NOT
    # github.actor, which is spoofable via comment-triggered force pushes.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-merge ONLY minor & patch. Majors fall through → wait for human review.
      # NOTE: this is inert (or unsafe) until "Allow auto-merge" is enabled AND a
      # branch-protection rule requires the CI checks (Lint / Type Check / Test /
      # Build). Without required checks, --auto merges immediately with no CI.
      - name: Enable auto-merge for minor & patch
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
