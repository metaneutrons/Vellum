name: Release Please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Prefer a GitHub App token. GITHUB_TOKEN-created PRs/releases do NOT trigger
      # downstream workflows (GitHub's recursion guard), so with the default token
      # the release PR's required checks stay "action_required" and the published
      # release never fires firmware.yml's `release: published` build — the stable
      # firmware silently never gets built. An App token is a real actor, so both
      # cascade normally. Inert until the App is provisioned: with vars.RELEASE_APP_ID
      # unset this step is skipped and the action falls back to GITHUB_TOKEN below.
      - name: Generate GitHub App token (if configured)
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          release-type: node
