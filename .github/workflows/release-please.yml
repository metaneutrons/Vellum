name: Release Please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require release automation token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is required. Refusing to create a release whose downstream artifact workflows cannot run."
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # A PAT is a real actor, so the release PR fires CI and a published
          # release fires its artifact workflows. GitHub suppresses downstream
          # events created with GITHUB_TOKEN, which can silently publish an empty
          # release; the preflight above therefore fails closed when the PAT is
          # unavailable instead of creating a partial release.
          token: ${{ secrets.RELEASE_PAT }}
          # Drive from the manifest config, NOT an inline release-type. The inline
          # `release-type: node` put the action in simple mode and IGNORED
          # release-please-config.json — so its `extra-files` rule that syncs
          # firmware/main/Kconfig.projbuild's VELLUM_FIRMWARE_VERSION never ran, and
          # the firmware built with a stale version string on every release.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
