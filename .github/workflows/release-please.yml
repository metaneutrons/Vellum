name: Release Please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # A PAT is a real actor, so the release PR fires CI (green checks, no
          # --admin) and the published release fires firmware.yml's `release:
          # published` build. GITHUB_TOKEN can't — GitHub suppresses downstream
          # events for token-created PRs/releases. Falls back to GITHUB_TOKEN when
          # RELEASE_PAT is unset (then downstream triggering won't work).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # Drive from the manifest config, NOT an inline release-type. The inline
          # `release-type: node` put the action in simple mode and IGNORED
          # release-please-config.json — so its `extra-files` rule that syncs
          # firmware/main/Kconfig.projbuild's VELLUM_FIRMWARE_VERSION never ran, and
          # the firmware built with a stale version string on every release.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
