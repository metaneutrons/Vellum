name: Firmware Build
on:
  push:
    branches: [main]
    paths: ['firmware/**']
  release:
    types: [published]
  workflow_dispatch:

env:
  IDF_VERSION: v6.0

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      channel: ${{ steps.calc.outputs.channel }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc
        run: |
          # Base version from Kconfig (SSOT: release-please)
          BASE=$(grep 'default "' firmware/main/Kconfig.projbuild | head -1 | grep -oP '\d+\.\d+\.\d+')

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${BASE}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            # Beta: count commits since last release tag
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              BETA_NUM=$(git rev-list ${LAST_TAG}..HEAD --count)
            else
              BETA_NUM=$(git rev-list HEAD --count)
            fi
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            VERSION="${BASE}-beta.${BETA_NUM}+${SHORT_SHA}"
            # '+' (SemVer build metadata) is illegal in a git ref — keep it in
            # VERSION (manifest/firmware string) but make the tag git-safe.
            TAG="v${VERSION//+/-}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: e1001
            target: esp32s3
            base: sdkconfig.defaults.s3
            panel: CONFIG_VELLUM_PANEL_GDEY075T7=y
          - model: e1002
            target: esp32s3
            base: sdkconfig.defaults.s3
            panel: CONFIG_VELLUM_PANEL_GDEP073E01=y
          - model: e1003
            target: esp32s3
            base: sdkconfig.defaults.s3
            panel: CONFIG_VELLUM_PANEL_E1003=y
          - model: d1001
            target: esp32p4
            base: sdkconfig.defaults.p4
            panel: CONFIG_VELLUM_PANEL_D1001=y
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v6

      - name: Inject version and configure
        run: |
          . $IDF_PATH/export.sh
          VERSION="${{ needs.version.outputs.version }}"
          cp ${{ matrix.base }} sdkconfig.defaults
          echo "CONFIG_VELLUM_FIRMWARE_VERSION=\"${VERSION}\"" >> sdkconfig.defaults
          echo "${{ matrix.panel }}" >> sdkconfig.defaults
          idf.py set-target ${{ matrix.target }}

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Extract binary
        run: |
          . $IDF_PATH/export.sh
          VERSION="${{ needs.version.outputs.version }}"
          cd build && esptool --chip ${{ matrix.target }} merge-bin --output ../vellum-${{ matrix.model }}-v${VERSION}.bin @flash_args
          cd .. && ls -lh vellum-${{ matrix.model }}-v${VERSION}.bin

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.model }}
          path: firmware/vellum-${{ matrix.model }}-*.bin

  sign-and-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: binaries
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd binaries
          for f in *.bin; do
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

      - name: Sign binaries (Ed25519)
        if: env.FIRMWARE_SIGNING_KEY != ''
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          echo "$FIRMWARE_SIGNING_KEY" | base64 -d > signing.key
          cd binaries
          for f in *.bin; do
            sha256sum "$f" | awk '{print $1}' | xxd -r -p > "${f}.hash"
            openssl pkeyutl -sign -inkey ../signing.key -rawin -in "${f}.hash" -out "${f}.sig"
            base64 "${f}.sig" > "${f}.sig.b64"
            rm -f "${f}.hash"
          done
          rm -f ../signing.key

      - name: Generate manifest
        run: |
          cd binaries
          VERSION="${{ needs.version.outputs.version }}"
          CHANNEL="${{ needs.version.outputs.channel }}"
          TAG="${{ needs.version.outputs.tag }}"
          node -e "
          const fs = require('fs');
          const manifest = {
            version: '${VERSION}',
            channel: '${CHANNEL}',
            date: new Date().toISOString(),
            binaries: {}
          };
          for (const f of fs.readdirSync('.').filter(f => f.endsWith('.bin'))) {
            const model = f.match(/vellum-(\w+)-/)?.[1];
            if (!model) continue;
            manifest.binaries[model] = {
              url: 'https://github.com/${{ github.repository }}/releases/download/${TAG}/' + f,
              sha256: fs.readFileSync(f + '.sha256', 'utf8').trim(),
              signature: fs.existsSync(f + '.sig.b64') ? fs.readFileSync(f + '.sig.b64', 'utf8').trim() : '',
              size: fs.statSync(f).size,
            };
          }
          fs.writeFileSync('firmware-manifest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          "

      - name: Upload to existing release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd binaries
          gh release upload "${{ github.event.release.tag_name }}" \
            *.bin *.sha256 firmware-manifest.json \
            --repo "${{ github.repository }}" --clobber

      - name: Create beta release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Firmware ${{ needs.version.outputs.version }}"
          prerelease: true
          make_latest: false
          files: |
            binaries/*.bin
            binaries/*.sha256
            binaries/firmware-manifest.json
