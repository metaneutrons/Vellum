name: Firmware Build
on:
  push:
    branches: [main]
    paths: ['firmware/**']
  release:
    types: [published]
  workflow_dispatch:

env:
  IDF_VERSION: v6.0

permissions:
  contents: read

jobs:
  version:
    # Firmware is versioned independently of the server (release-please `firmware`
    # component → tag `firmware-v*`). A stable firmware build fires ONLY for a
    # firmware-scoped release; server releases (`v*`) publish no firmware, so the
    # fleet — which discovers updates by the presence of a firmware-manifest.json
    # asset, not by tag or "latest" — correctly sees nothing new. Beta builds
    # (push to firmware/**) and manual dispatch always run.
    #
    # On a server release this job SKIPS; `build` (needs: version) and
    # `sign-and-release` (needs: [version, build]) then skip too via the default
    # success() gating of their `if:`. Do NOT add always()/!cancelled() to those
    # jobs or they'd run on server releases against the wrong event.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'firmware')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      channel: ${{ steps.calc.outputs.channel }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc
        run: |
          # Base version from Kconfig (SSOT: release-please). Anchor to the
          # VELLUM_FIRMWARE_VERSION config block (marked by x-release-please-version)
          # so an unrelated `default "..."` added above it can't hijack the version.
          BASE=$(grep -A3 'config VELLUM_FIRMWARE_VERSION' firmware/main/Kconfig.projbuild \
                 | grep -m1 -oP 'default "\K\d+\.\d+\.\d+')

          if [ "${{ github.event_name }}" = "release" ]; then
            # Honour the release's prerelease flag so a firmware-v*-beta release
            # published manually is labelled beta, not stable.
            CHAN=stable
            [ "${{ github.event.release.prerelease }}" = "true" ] && CHAN=beta
            echo "version=${BASE}" >> $GITHUB_OUTPUT
            echo "channel=${CHAN}" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            # Beta: count commits since the last STABLE firmware tag. Anchor to the
            # firmware tag line (`firmware-v1.2.3`) and exclude betas (`*-beta*`) so
            # BETA_NUM stays monotonic and never anchors to a server `v*` tag.
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'firmware-v[0-9]*' \
                         --exclude '*-beta*' 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              BETA_NUM=$(git rev-list ${LAST_TAG}..HEAD --count)
            else
              BETA_NUM=$(git rev-list HEAD --count)
            fi
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            VERSION="${BASE}-beta.${BETA_NUM}+${SHORT_SHA}"
            # '+' (SemVer build metadata) is illegal in a git ref — keep it in
            # VERSION (manifest/firmware string) but make the tag git-safe.
            TAG="firmware-v${VERSION//+/-}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    # Skip the redundant beta pipeline for release-please's own release commit; the
    # stable firmware build fires moments later from the `release: published` event.
    # Two ways a release lands on main:
    #  - squash-merge → subject `chore(main): release …` / `chore(firmware): release …`
    #    (anchored to the SUBJECT start so a normal commit whose BODY merely says
    #    "release" is not skipped);
    #  - merge-commit (the required flow for release PRs, see docs/RELEASING.md) →
    #    `Merge pull request #N from …/release-please--branches--…`, matched by the
    #    branch marker so the merge doesn't fire a second, redundant beta.
    # Always build for real releases and manual dispatch.
    if: >-
      github.event_name != 'push' ||
      !(startsWith(github.event.head_commit.message, 'chore(main): release ') ||
        startsWith(github.event.head_commit.message, 'chore(firmware): release ') ||
        contains(github.event.head_commit.message, 'release-please--branches'))
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0@sha256:c41bed8b8b28815526b70eac307452fb432c7904a9157fbaaa04784ac4840ad7
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: e1001
            target: esp32s3
            base: sdkconfig.defaults.s3
            panel: CONFIG_VELLUM_PANEL_GDEY075T7=y
          - model: e1002
            target: esp32s3
            base: sdkconfig.defaults.s3
            panel: CONFIG_VELLUM_PANEL_GDEP073E01=y
          - model: e1003
            target: esp32s3
            base: sdkconfig.defaults.s3
            overlay: sdkconfig.defaults.e1003
            panel: CONFIG_VELLUM_PANEL_E1003=y
          - model: d1001
            target: esp32p4
            base: sdkconfig.defaults.p4
            panel: CONFIG_VELLUM_PANEL_D1001=y
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inject version and configure
        run: |
          . $IDF_PATH/export.sh
          VERSION="${{ needs.version.outputs.version }}"
          DEFAULTS="${{ matrix.base }}"
          OVERLAY="${{ matrix.overlay }}"
          if [ -n "$OVERLAY" ]; then DEFAULTS="$DEFAULTS;$OVERLAY"; fi
          printf 'CONFIG_VELLUM_FIRMWARE_VERSION="%s"\n%s\n' \
            "$VERSION" "${{ matrix.panel }}" > sdkconfig.ci
          # Make esp_app_get_description()->version match the release version too
          # (ESP-IDF reads version.txt for PROJECT_VER; APP_PROJECT_VER_FROM_CONFIG=n).
          echo "${VERSION}" > version.txt
          # -DVELLUM_MODEL bakes the model into the app-descriptor project_name
          # (vellum-<model>) so the OTA client can reject a wrong-model image.
          idf.py -DVELLUM_MODEL=${{ matrix.model }} \
            -DSDKCONFIG_DEFAULTS="$DEFAULTS;sdkconfig.ci" \
            set-target ${{ matrix.target }}

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py -DVELLUM_MODEL=${{ matrix.model }} build

      - name: Extract binaries (app image for OTA + merged image for web flasher)
        run: |
          . $IDF_PATH/export.sh
          VERSION="${{ needs.version.outputs.version }}"
          SAFE=$(printf '%s' "$VERSION" | tr '+' '-')   # url/file-safe (POSIX sh; drops '+build' separator)
          MODEL="${{ matrix.model }}"
          OTA="vellum-${MODEL}-v${SAFE}.bin"
          # App-only image → OTA. Per-model project name (project(vellum-<model>))
          # lets the client reject a wrong-model image; source it by that name.
          cp "build/vellum-${MODEL}.bin" "$OTA"

          # Secure Boot v2 OTA — OPT-IN, OFF in dev (vars.OTA_SECURE_BOOT != '1').
          # When enabled, append the RSA-3072 signature block so the image boots on
          # SB-provisioned devices. The OTA digest below is the appended app hash,
          # which sits BEFORE this block, so the Ed25519/otaSha256 contract holds
          # regardless of the append. Requires the HSM/PKCS#11 config (see
          # docs/SECURE_BOOT_AND_KMS.md, Phase B). NOT exercised in CI while dev —
          # validate on a secureboot board before first fleet rollout.
          if [ "${{ vars.OTA_SECURE_BOOT }}" = "1" ]; then
            [ -f hsm_config.ini ] || { echo "::error::OTA_SECURE_BOOT=1 but firmware/hsm_config.ini is absent — provide the PKCS#11/HSM config (docs/SECURE_BOOT_AND_KMS.md)"; exit 1; }
            espsecure.py sign_data --version 2 --hsm --hsm-config hsm_config.ini --output "${OTA}.signed" "$OTA" \
              || { echo "::error::Secure Boot v2 OTA signing failed for $OTA"; exit 1; }
            mv "${OTA}.signed" "$OTA"
            echo "Secure Boot v2 signature block appended to $OTA"
          fi

          # OTA digest = the app image's appended SHA-256 (esptool 'Validation hash').
          # This equals esp_partition_get_sha256() on-device and is read from the
          # correct offset even when a Secure Boot block trails the image — so it is
          # robust to the optional append above (NOT tail -c 32 of a signed file).
          DIGEST=$(esptool image-info "$OTA" 2>/dev/null | sed -nE 's/.*[Vv]alidation [Hh]ash:[[:space:]]*([0-9a-f]{64}).*/\1/p' | head -1)
          [ -n "$DIGEST" ] || { echo "::error::$OTA has no appended validation hash (hash_appended disabled?)"; exit 1; }
          printf '%s' "$DIGEST" > "${OTA}.sha256"

          # Merged full-flash image → web flasher (ESP Web Tools writes it at 0x0).
          cd build && esptool --chip ${{ matrix.target }} merge-bin \
            --output "../vellum-${MODEL}-v${SAFE}-factory.bin" @flash_args
          cd .. && ls -lh vellum-${MODEL}-v${SAFE}*.bin "${OTA}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: firmware-${{ matrix.model }}
          path: |
            firmware/vellum-${{ matrix.model }}-*.bin
            firmware/vellum-${{ matrix.model }}-*.bin.sha256

  sign-and-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create/upload releases
      id-token: write        # OIDC for SLSA build provenance
      attestations: write    # write the provenance attestation
    env:
      # Job-level so step `if:` can read it reliably (step-level env is unreliable in `if`).
      # Phase 3: KMS-preferred signing. When the OTA_KMS_KEY_VERSION repo variable is
      # set, the OTA image is signed by a cloud KMS key via OIDC (no long-lived secret);
      # otherwise it falls back to the legacy FIRMWARE_SIGNING_KEY secret. See
      # docs/SECURE_BOOT_AND_KMS.md for provisioning. Set both, one, or neither.
      OTA_KMS_KEY: ${{ vars.OTA_KMS_KEY_VERSION }}
      FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (embedded-pubkey check)

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: binaries
          merge-multiple: true

      - name: Guard app image fits the OTA partition (fail before signing/publishing)
        run: |
          # ota_0/ota_1 hold the OTA app image; parse ota_0's size from the
          # partition table so this stays correct if the layout ever changes.
          # Secure Boot builds relocate partitions; parse the table matching the build.
          PART=firmware/partitions.csv
          [ "${{ vars.OTA_SECURE_BOOT }}" = "1" ] && PART=firmware/partitions.secure.csv
          OTA_MAX=$(awk -F',' '$1 ~ /^ota_0/ {gsub(/[[:space:]]/,"",$5); print $5}' "$PART")
          OTA_MAX=$((OTA_MAX))                 # 0x300000 -> decimal
          HEADROOM=$((64 * 1024))              # keep a little slack under the limit
          LIMIT=$((OTA_MAX - HEADROOM))
          echo "ota_0 size=${OTA_MAX} bytes; app-image limit (with headroom)=${LIMIT} bytes"
          FAIL=0
          for f in binaries/vellum-*-v*.bin; do
            case "$f" in *-factory.bin) continue;; esac   # factory = full-flash, not OTA
            SZ=$(stat -c%s "$f")
            if [ "$SZ" -ge "$LIMIT" ]; then
              echo "::error::${f} is ${SZ} bytes, >= OTA app limit ${LIMIT} (ota_0=${OTA_MAX}). Would not fit / no headroom."
              FAIL=1
            else
              echo "OK: ${f} ${SZ} bytes < ${LIMIT}"
            fi
          done
          [ "$FAIL" -eq 0 ]

      - name: Verify precomputed OTA digests (built via esptool image-info == esp_partition_get_sha256)
        run: |
          # The build job derives each digest from the app image's appended
          # 'Validation hash' (esptool image-info) — read from the correct offset even
          # when a Secure Boot block trails the image, so it is NOT tail -c 32 of a
          # signed file. Here we only confirm the sidecar arrived intact.
          cd binaries
          for f in vellum-*-v*.bin; do
            case "$f" in *-factory.bin) continue;; esac
            [ -s "$f.sha256" ] || { echo "::error::$f: missing precomputed digest sidecar from the build job"; exit 1; }
            grep -qE '^[0-9a-f]{64}$' "$f.sha256" || { echo "::error::$f.sha256 is not a 64-hex digest"; exit 1; }
          done

      - name: Require a signing key for stable releases (devices are fail-closed)
        if: github.event_name == 'release' && env.OTA_KMS_KEY == '' && env.FIRMWARE_SIGNING_KEY == ''
        run: |
          echo "::error::No OTA signing key available (neither OTA_KMS_KEY_VERSION nor FIRMWARE_SIGNING_KEY). Fail-closed devices reject unsigned OTA, so a stable release must be signed."
          exit 1

      # ── KMS signing path (preferred): keyless via OIDC, no secret on the runner ──
      - name: Authenticate to Google Cloud (OIDC, keyless)
        if: env.OTA_KMS_KEY != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.OTA_KMS_WIF_PROVIDER }}
          service_account: ${{ vars.OTA_KMS_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: env.OTA_KMS_KEY != ''
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Sign binaries (Ed25519 via KMS) and verify the key matches the embedded pubkey
        if: env.OTA_KMS_KEY != ''
        run: |
          # KMS key spec must be EC_SIGN_ED25519 (GCP): pure EdDSA over the raw message,
          # raw 64-byte r||s signature — byte-identical to what the device verifies.
          gcloud kms keys versions get-public-key "${OTA_KMS_KEY##*/cryptoKeyVersions/}" \
            --key "$(echo "$OTA_KMS_KEY" | sed -E 's#.*/cryptoKeys/([^/]+)/.*#\1#')" \
            --keyring "$(echo "$OTA_KMS_KEY" | sed -E 's#.*/keyRings/([^/]+)/.*#\1#')" \
            --location "$(echo "$OTA_KMS_KEY" | sed -E 's#.*/locations/([^/]+)/.*#\1#')" \
            --output-file kms_pub.pem
          PUB=$(openssl pkey -pubin -in kms_pub.pem -pubout -outform DER | tail -c 32 | base64 | tr -d '\n')
          echo "$PUB" | base64 -d > binaries/.signer_pub_raw           # for the roundtrip verify
          # Guard: signer pubkey MUST equal an embedded trusted key (primary OR next),
          # else every fail-closed device rejects every update.
          EMB_PRIMARY=$(awk '/^[[:space:]]*config VELLUM_OTA_SIGNING_PUBKEY[[:space:]]*$/{f=1;next} f&&/default "/{gsub(/^.*default "|".*$/,"");print;exit}' firmware/main/Kconfig.projbuild)
          EMB_NEXT=$(awk '/^[[:space:]]*config VELLUM_OTA_SIGNING_PUBKEY_NEXT[[:space:]]*$/{f=1;next} f&&/default "/{gsub(/^.*default "|".*$/,"");print;exit}' firmware/main/Kconfig.projbuild)
          if [ "$PUB" != "$EMB_PRIMARY" ] && [ "$PUB" != "$EMB_NEXT" ]; then
            echo "::error::KMS public key ($PUB) matches neither embedded primary ($EMB_PRIMARY) nor next ($EMB_NEXT). Devices would reject all updates."
            exit 1
          fi
          echo "KMS public key matches an embedded trusted key ✓"
          # Stamp the manifest with the id of the slot that actually matched, so
          # otaKeyId is correct even mid-rotation (signing with the 'next' key).
          if [ "$PUB" = "$EMB_PRIMARY" ]; then
            KID=$(awk '/^[[:space:]]*config VELLUM_OTA_SIGNING_KEY_ID[[:space:]]*$/{f=1;next} f&&/default "/{gsub(/^.*default "|".*$/,"");print;exit}' firmware/main/Kconfig.projbuild)
          else
            KID=$(awk '/^[[:space:]]*config VELLUM_OTA_SIGNING_KEY_ID_NEXT[[:space:]]*$/{f=1;next} f&&/default "/{gsub(/^.*default "|".*$/,"");print;exit}' firmware/main/Kconfig.projbuild)
          fi
          echo "OTA_KEY_ID_RESOLVED=$KID" >> "$GITHUB_ENV"
          cd binaries
          for f in vellum-*-v*.bin; do
            case "$f" in *-factory.bin) continue;; esac
            xxd -r -p "$f.sha256" > "$f.hash"                          # raw 32-byte digest = message (build's image-info sidecar)
            gcloud kms asymmetric-sign \
              --version "${OTA_KMS_KEY##*/cryptoKeyVersions/}" \
              --key "$(echo "$OTA_KMS_KEY" | sed -E 's#.*/cryptoKeys/([^/]+)/.*#\1#')" \
              --keyring "$(echo "$OTA_KMS_KEY" | sed -E 's#.*/keyRings/([^/]+)/.*#\1#')" \
              --location "$(echo "$OTA_KMS_KEY" | sed -E 's#.*/locations/([^/]+)/.*#\1#')" \
              --input-file "$f.hash" --signature-file "$f.sig"
            SIGLEN=$(wc -c < "$f.sig")
            [ "$SIGLEN" -eq 64 ] || { echo "::error::$f: expected raw 64-byte Ed25519 sig, got $SIGLEN (DER? wrong algorithm?)"; exit 1; }
            base64 -w0 "$f.sig" > "$f.sig.b64"
          done

      # ── Legacy local-key path (fallback when KMS is not configured) ──────────────
      - name: Sign binaries (Ed25519, local key) and verify the key matches the embedded pubkey
        if: env.OTA_KMS_KEY == '' && env.FIRMWARE_SIGNING_KEY != ''
        run: |
          echo "$FIRMWARE_SIGNING_KEY" | base64 -d > signing.key
          # Guard: the signing key's public half MUST equal an embedded trusted key
          # (primary OR next), otherwise every device would reject every update. Raw
          # Ed25519 pubkey = last 32 bytes of the DER SubjectPublicKeyInfo.
          PUB=$(openssl pkey -in signing.key -pubout -outform DER | tail -c 32 | base64 | tr -d '\n')
          echo "$PUB" | base64 -d > binaries/.signer_pub_raw
          EMB_PRIMARY=$(awk '/^[[:space:]]*config VELLUM_OTA_SIGNING_PUBKEY[[:space:]]*$/{f=1;next} f&&/default "/{gsub(/^.*default "|".*$/,"");print;exit}' firmware/main/Kconfig.projbuild)
          EMB_NEXT=$(awk '/^[[:space:]]*config VELLUM_OTA_SIGNING_PUBKEY_NEXT[[:space:]]*$/{f=1;next} f&&/default "/{gsub(/^.*default "|".*$/,"");print;exit}' firmware/main/Kconfig.projbuild)
          if [ "$PUB" != "$EMB_PRIMARY" ] && [ "$PUB" != "$EMB_NEXT" ]; then
            echo "::error::Signing key public part ($PUB) matches neither embedded primary ($EMB_PRIMARY) nor next ($EMB_NEXT). Devices would reject all updates."
            rm -f signing.key; exit 1
          fi
          echo "Signing key matches an embedded trusted key ✓"
          if [ "$PUB" = "$EMB_PRIMARY" ]; then
            KID=$(awk '/^[[:space:]]*config VELLUM_OTA_SIGNING_KEY_ID[[:space:]]*$/{f=1;next} f&&/default "/{gsub(/^.*default "|".*$/,"");print;exit}' firmware/main/Kconfig.projbuild)
          else
            KID=$(awk '/^[[:space:]]*config VELLUM_OTA_SIGNING_KEY_ID_NEXT[[:space:]]*$/{f=1;next} f&&/default "/{gsub(/^.*default "|".*$/,"");print;exit}' firmware/main/Kconfig.projbuild)
          fi
          echo "OTA_KEY_ID_RESOLVED=$KID" >> "$GITHUB_ENV"
          cd binaries
          for f in vellum-*-v*.bin; do
            case "$f" in *-factory.bin) continue;; esac
            xxd -r -p "$f.sha256" > "$f.hash"                           # raw 32-byte digest (build's image-info sidecar)
            openssl pkeyutl -sign -inkey ../signing.key -rawin -in "$f.hash" -out "$f.sig"
            base64 -w0 "$f.sig" > "$f.sig.b64"                           # no line wrapping
          done
          cd .. && rm -f signing.key

      - name: Verify signatures (pure Ed25519 roundtrip — reject pre-hash/DER)
        if: env.OTA_KMS_KEY != '' || env.FIRMWARE_SIGNING_KEY != ''
        run: |
          # Independent acceptance test: every produced signature must verify as PURE
          # Ed25519 (PSA_ALG_PURE_EDDSA) over the raw 32-byte digest, exactly as the
          # device does. Catches a KMS that returns Ed25519ph or DER before the fleet does.
          cd binaries
          # Wrap the raw 32-byte signer pubkey into a DER SPKI, then to PEM.
          printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00' | cat - .signer_pub_raw > spki.der
          openssl pkey -pubin -inform DER -in spki.der -out signer_pub.pem
          for f in vellum-*-v*.bin; do
            case "$f" in *-factory.bin) continue;; esac
            [ -f "$f.sig.b64" ] || { echo "::error::$f has no signature"; exit 1; }
            xxd -r -p "$f.sha256" > "$f.hash"
            base64 -d "$f.sig.b64" > "$f.sig.raw"
            openssl pkeyutl -verify -pubin -inkey signer_pub.pem -rawin -in "$f.hash" -sigfile "$f.sig.raw" \
              || { echo "::error::$f signature failed pure-Ed25519 roundtrip verify"; exit 1; }
            echo "OK: $f verified"
          done
          rm -f .signer_pub_raw spki.der signer_pub.pem *.hash *.sig.raw *.sig

      - name: Generate manifest
        env:
          MVER: ${{ needs.version.outputs.version }}
          MCHAN: ${{ needs.version.outputs.channel }}
          MTAG: ${{ needs.version.outputs.tag }}
          MREPO: ${{ github.repository }}
          MKID: ${{ env.OTA_KEY_ID_RESOLVED }}   # id of the slot that actually signed (set by the sign step)
        run: |
          cd binaries
          node -e "
          const fs = require('fs');
          const { MVER, MCHAN, MTAG, MREPO, MKID } = process.env;
          const SAFE = MVER.replace(/\+/g, '-');
          const base = 'https://github.com/' + MREPO + '/releases/download/' + MTAG;
          const manifest = { version: MVER, channel: MCHAN, date: new Date().toISOString(), binaries: {} };
          for (const f of fs.readdirSync('.')) {
            if (!f.endsWith('.bin') || f.endsWith('-factory.bin')) continue;  // OTA app images only
            const m = f.match(/vellum-(\w+)-v/);
            if (!m) continue;
            const model = m[1];
            const factory = 'vellum-' + model + '-v' + SAFE + '-factory.bin';
            manifest.binaries[model] = {
              url: base + '/' + factory,                                   // web flasher (0x0)
              size: fs.existsSync(factory) ? fs.statSync(factory).size : 0,
              otaUrl: base + '/' + f,                                      // OTA app image
              otaSha256: fs.readFileSync(f + '.sha256', 'utf8').trim(),
              otaSignature: fs.existsSync(f + '.sig.b64') ? fs.readFileSync(f + '.sig.b64', 'utf8').trim() : '',
              otaKeyId: MKID || '',                                        // signer id → device fast-path hint
              otaSize: fs.statSync(f).size,
            };
          }
          fs.writeFileSync('firmware-manifest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          "

      - name: Verify manifest integrity (all models present + complete) before publish
        env:
          # Signatures are mandatory on real releases (devices are fail-closed); on
          # beta builds an unset FIRMWARE_SIGNING_KEY yields empty signatures, which
          # dev/fail-open devices still accept — so only hard-require on release.
          REQUIRE_SIG: ${{ github.event_name == 'release' }}
        run: |
          cd binaries
          REQUIRE_SIG="$REQUIRE_SIG" node -e "
          const fs = require('fs');
          const EXPECTED = ['e1001', 'e1002', 'e1003', 'd1001'];   // the full fleet
          const requireSig = process.env.REQUIRE_SIG === 'true';
          const m = JSON.parse(fs.readFileSync('firmware-manifest.json', 'utf8'));
          const bins = m.binaries || {};
          const errors = [];
          for (const model of EXPECTED) {
            const b = bins[model];
            if (!b) { errors.push(model + ': missing from manifest'); continue; }
            if (!b.otaSha256) errors.push(model + ': empty otaSha256');
            if (!(b.otaSize > 0)) errors.push(model + ': otaSize not > 0');
            if (requireSig && !b.otaSignature) errors.push(model + ': empty otaSignature (required for release)');
          }
          const extra = Object.keys(bins).filter(k => !EXPECTED.includes(k));
          if (extra.length) console.log('note: unexpected models in manifest: ' + extra.join(', '));
          if (errors.length) {
            for (const e of errors) console.error('::error::manifest ' + e);
            process.exit(1);
          }
          console.log('Manifest integrity OK: ' + EXPECTED.join(', ') + (requireSig ? ' (signatures required)' : ''));
          "

      # SLSA build provenance: signed, verifiable attestation binding every
      # released .bin to this workflow run + commit. Verify with:
      #   gh attestation verify <file> --repo metaneutrons/Vellum
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "binaries/*.bin"

      # Atomic-ish publish: upload the images/digests FIRST, then the manifest
      # LAST in a separate step. resolveOta() keys off the manifest, so a device
      # polling mid-publish must never see a manifest whose assets aren't up yet.
      - name: Upload images to existing release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd binaries
          gh release upload "${{ github.event.release.tag_name }}" \
            *.bin *.sha256 \
            --repo "${{ github.repository }}" --clobber

      - name: Upload manifest to existing release (last, after all images)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd binaries
          gh release upload "${{ github.event.release.tag_name }}" \
            firmware-manifest.json \
            --repo "${{ github.repository }}" --clobber

      # Release Please creates the stable release before this workflow runs.
      # Normalize its title and prevent a hardware artifact release from taking
      # GitHub's single "Latest" badge away from the current server release.
      - name: Normalize stable firmware release presentation
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/${{ github.event.release.id }}" \
            -f "name=Vellum Firmware v${{ needs.version.outputs.version }}" \
            -F "make_latest=false"

      - name: Create beta release with images (manifest uploaded last, below)
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Vellum Firmware v${{ needs.version.outputs.version }}"
          prerelease: true
          make_latest: false
          files: |
            binaries/*.bin
            binaries/*.sha256

      - name: Add manifest to beta release (last, after all images)
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Vellum Firmware v${{ needs.version.outputs.version }}"
          prerelease: true
          make_latest: false
          files: |
            binaries/firmware-manifest.json
