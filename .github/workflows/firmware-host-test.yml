name: Firmware Host Tests
# Runs on EVERY push/PR to main (no path filter) on purpose: this is a REQUIRED
# status check, and a required check that is path-filtered would sit forever in
# "Expected — Waiting for status" on any PR that doesn't touch firmware/**,
# wedging it. The suite is self-contained (cmake + OpenSSL, a few seconds), so
# running it unconditionally is cheap and keeps every PR mergeable.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  host-tests:
    name: Firmware logic/crypto host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Configure
        run: cmake -S firmware/host_test -B firmware/host_test/build

      - name: Build
        run: cmake --build firmware/host_test/build

      - name: Test
        run: ctest --test-dir firmware/host_test/build --output-on-failure
